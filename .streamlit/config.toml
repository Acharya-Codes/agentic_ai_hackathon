[theme]
base = "dark"
primaryColor = "#4F8CFF"
backgroundColor = "#0A0E14"
secondaryBackgroundColor = "#121823"
textColor = "#E8ECF3"
font = "sans serif"

[server]
# Only this PC can open the dashboard. Without this line, anyone on the same
# Wi-Fi could reach a tool that can change your firewall.
address = "127.0.0.1"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
